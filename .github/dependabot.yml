# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    # Only routinely update **development** dependencies. Unlike our Java SDKs, Python dependencies are installed into
    # the consumer's environment rather than shadowed into our SDK, so raising runtime dependency versions can force
    # upgrades on consumers. Runtime dependencies are therefore only updated when necessary (typically through
    # Dependabot security updates).
    allow:
      - dependency-type: "development"
    groups:
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      # Ignore versions that are incompatible with Python 3.7
      # OpenAPI Generator 7.10 requires typing.Literal which was released in Python 3.8 via PEP 586)
      # See:
      #   - https://github.com/OpenAPITools/openapi-generator/pull/20014
      #   - https://docs.python.org/3/whatsnew/3.8.html#typing
      #   - https://peps.python.org/pep-0586/
      - dependency-name: "openapitools/openapi-generator-cli"
        versions:
          - ">=7.10.0"