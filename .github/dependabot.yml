# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    # Only routinely update **development** dependencies. Unlike our Java SDKs, Python dependencies are installed into
    # the consumer's environment rather than shadowed into our SDK, so raising runtime dependency versions can force
    # upgrades on consumers. Runtime dependencies are therefore only updated when necessary (typically through
    # Dependabot security updates).
    allow:
      - dependency-type: "development"
    groups:
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7